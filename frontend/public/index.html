            // there is no duplicate request once React mounts.
            (function () {
                var path = window.location.pathname || "/";
                var isHome = path === "/" || path === "/browse" || path === "/browse/" ||
                    path.indexOf("/browse/genre/") === 0 || path === "/browse/latest" || path === "/browse/trending";
                if (!isHome || !window.fetch) return;
                window.__FLIXIT_HOME_FAST_PROMISE__ = fetch("/api/public/home-bootstrap-fast", {
                    headers: { Accept: "application/json" },
                    cache: "no-store"
                }).then(function (response) {
                    if (!response.ok) return null;
                    return response.json();
                }).then(function (data) {
                    return data && Array.isArray(data.rows) ? data : null;
                }).catch(function () { return null; });
            })();
        </script>

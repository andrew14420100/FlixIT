name: Update SC artwork catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - scripts/build_sc_artwork_catalog.py
      - scripts/build_sc_artwork_catalog_v4.py
      - .github/workflows/update-sc-artwork-catalog.yml

permissions:
  contents: write

concurrency:
  group: sc-artwork-catalog
  cancel-in-progress: true

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SC_BASE_URL: "https://streamingunity-premium.to"
      SC_ARTWORK_REQUEST_DELAY: "0.85"
      SC_ARTWORK_TRANSIENT_RETRIES: "8"
      SC_ARTWORK_MIN_YEAR: "1910"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build complete StreamingCommunity artwork index
        shell: bash
        run: |
          set +e
          python scripts/build_sc_artwork_catalog_v4.py \
            --minimum 18000 \
            --output /tmp/sc_artwork_catalog.json
          status=$?
          set -e

          if [ "$status" -eq 0 ] && [ -s /tmp/sc_artwork_catalog.json ]; then
            echo "SC_BUILD_OK=1" >> "$GITHUB_ENV"
            echo "Fresh SC artwork catalog built successfully"
          else
            echo "SC_BUILD_OK=0" >> "$GITHUB_ENV"
            echo "::warning::SC artwork source is temporarily unavailable; keeping the last committed valid catalog"
          fi

      - name: Validate catalog coverage
        if: env.SC_BUILD_OK == '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("/tmp/sc_artwork_catalog.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          count = int(data.get("count") or 0)
          reported = int(data.get("reported_total_count") or 0)
          cdn = data.get("cdn_base_url")
          domain = data.get("source_base_url")
          coverage = data.get("coverage_ratio")
          print(f"SC catalog entries: {count}")
          print(f"SC reported titles: {reported}")
          print(f"SC coverage: {coverage}")
          print(f"SC source: {domain}")
          print(f"SC CDN: {cdn}")
          if count < 18000:
              raise SystemExit(f"Catalog incomplete: expected at least 18000 artwork titles, got {count}")
          if reported and count < int(reported * 0.96):
              raise SystemExit(f"Catalog coverage too low: {count}/{reported}")
          if not cdn:
              raise SystemExit("Catalog incomplete: missing cdn_base_url")
          if "streamingcommunityz.ninja" in str(cdn).lower():
              raise SystemExit(f"Catalog rejected: deprecated CDN with invalid browser certificate: {cdn}")
          PY

      - name: Publish validated catalog
        if: env.SC_BUILD_OK == '1'
        run: |
          cp /tmp/sc_artwork_catalog.json backend/data/sc_artwork_catalog.json
          cp /tmp/sc_artwork_catalog.json frontend/public/sc-artwork-catalog.json

      - name: Keep previous catalog on source outage
        if: env.SC_BUILD_OK != '1'
        run: |
          test -s backend/data/sc_artwork_catalog.json
          test -s frontend/public/sc-artwork-catalog.json
          echo "Existing validated catalog retained; next scheduled run will retry automatically."

      - name: Commit updated catalog
        if: env.SC_BUILD_OK == '1'
        run: |
          if git diff --quiet -- backend/data/sc_artwork_catalog.json frontend/public/sc-artwork-catalog.json; then
            echo "Catalog already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/sc_artwork_catalog.json frontend/public/sc-artwork-catalog.json
          git commit -m "chore: refresh SC artwork catalog"
          git pull --rebase origin main
          git push origin HEAD:main

name: Update SC artwork catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: sc-artwork-catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build full StreamingCommunity artwork index
        run: python scripts/build_sc_artwork_catalog.py --output backend/data/sc_artwork_catalog.json
      - name: Commit updated catalog
        run: |
          if git diff --quiet -- backend/data/sc_artwork_catalog.json; then
            echo "Catalog already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/sc_artwork_catalog.json
          git commit -m "chore: refresh SC artwork catalog"
          git push

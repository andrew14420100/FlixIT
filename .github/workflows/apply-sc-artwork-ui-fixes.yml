name: Apply SC artwork UI fixes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-sc-artwork-ui-fixes.yml

permissions:
  contents: write

concurrency:
  group: sc-artwork-ui-fixes
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply SC logo and fast episode hotfixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def regex_replace(path, pattern, replacement, marker=None):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker and marker in text:
                  print(f"[ok] {path}: {marker}")
                  return
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Pattern not found: {path} / {pattern[:100]}")
              p.write_text(updated, encoding="utf-8")
              print(f"[patched] {path}")

          def exact_replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new and new in text:
                  print(f"[ok] {path}")
                  return
              if old not in text:
                  if not new:
                      print(f"[ok] {path}")
                      return
                  raise SystemExit(f"Exact text not found: {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"[patched] {path}")

          # ---- Hero: SC proxy URLs must remain same-origin, never become TMDB URLs. ----
          hero = "frontend/src/components/HeroSection.tsx"
          exact_replace(hero, 'const TMDB_HERO_LOGO_BASE = "https://image.tmdb.org/t/p/original";\n', '')
          regex_replace(
              hero,
              r'function heroLogoUrl\(value: any\) \{.*?\n\}\n\nfunction firstHeroLogo',
              textwrap.dedent('''
              function heroLogoUrl(value: any) {
                const raw =
                  typeof value === "string"
                    ? value
                    : typeof value?.url === "string"
                    ? value.url
                    : "";
                const text = String(raw || "").trim();
                if (!text) return null;
                if (text.startsWith("/api/") || text.startsWith("/assets/") || text.startsWith("/static/")) {
                  return text;
                }
                if (text.startsWith("data:") || text.startsWith("blob:")) return text;
                if (/^https?:\\/\\//i.test(text)) {
                  if (/image\\.tmdb\\.org/i.test(text)) return null;
                  return text;
                }
                return null;
              }

              function firstHeroLogo
              ''').lstrip(),
              marker='text.startsWith("/api/")',
          )

          text = Path(hero).read_text(encoding="utf-8")
          if 'function isScSource(value: any)' not in text:
              needle = textwrap.dedent('''
              function firstHeroLogo(...values: any[]) {
                for (const value of values) {
                  const resolved = heroLogoUrl(value);
                  if (resolved) return resolved;
                }
                return null;
              }
              ''').lstrip()
              replacement = needle + textwrap.dedent('''

              function isScSource(value: any) {
                const source = String(value || "").trim().toLowerCase();
                return source === "streamingcommunity" || source.startsWith("streamingcommunity_");
              }
              ''')
              exact_replace(hero, needle, replacement)

          regex_replace(
              hero,
              r'function initialHeroLogo\(hero: any\) \{.*?\n\}\n\nfunction normalizeGenreNames',
              textwrap.dedent('''
              function initialHeroLogo(hero: any) {
                if (!isScSource(hero?.assets?.logo_source)) return null;
                return firstHeroLogo(
                  hero?.assets?.logo_path,
                  hero?.assets?.logo_url,
                  hero?.logo_path,
                  hero?.logoUrl
                );
              }

              function normalizeGenreNames
              ''').lstrip(),
              marker='if (!isScSource(hero?.assets?.logo_source)) return null;',
          )

          regex_replace(
              hero,
              r'  const logoPath = firstHeroLogo\(.*?\n  \);\n  const fallbackLogoPath = firstHeroLogo\(.*?\n  \);',
              textwrap.dedent('''
                const logoPath = isScSource(assets?.logo_source)
                  ? firstHeroLogo(
                      assets?.logo_path,
                      assets?.logo_url,
                      heroSettings?.logo_path,
                      heroSettings?.logoUrl
                    )
                  : null;
                const fallbackLogoPath = null;
              ''').rstrip(),
              marker='const fallbackLogoPath = null;',
          )

          # ---- Live SC assets: use the CDN encoded in the committed SC catalogue. ----
          artwork = "backend/services/artwork_card_policy.py"
          asset_fn = textwrap.dedent('''
          def _asset_url(value: Any) -> Optional[str]:
              if isinstance(value, dict):
                  value = (
                      value.get("url")
                      or value.get("src")
                      or value.get("filename")
                      or value.get("file")
                      or value.get("path")
                      or value.get("uuid")
                      or value.get("id")
                  )
              raw = str(value or "").strip()
              if not raw:
                  return None
              if re.match(r"^https?://", raw, re.I):
                  return _safe_url(raw)

              try:
                  from services.sc_artwork_catalog import _url_for
                  resolved = _url_for(raw)
                  if resolved:
                      return _safe_url(resolved)
              except Exception:
                  pass

              filename = raw.lstrip("/")
              if not re.search(r"\\.[a-z0-9]{2,5}$", filename, re.I):
                  filename += ".webp"
              return _safe_url(f"{SC_CDN_BASE}{filename}")
          ''').strip() + "\n\n\n"
          regex_replace(
              artwork,
              r'def _asset_url\(value: Any\) -> Optional\[str\]:.*?\n\n\ndef _images',
              asset_fn + 'def _images',
              marker='from services.sc_artwork_catalog import _url_for',
          )

          # ---- Episodes: short first-response warmup + deduplicated season refresh. ----
          policy = "backend/services/italian_episode_policy.py"
          exact_replace(
              policy,
              'POLICY_VERSION = "strict-explicit-it-v5-auto-refresh-en-fallback"\n',
              'POLICY_VERSION = "strict-explicit-it-v6-fast-first-response"\nFIRST_RESPONSE_WARM_SECONDS = max(0.2, min(1.5, float(os.environ.get("ITALIAN_FIRST_RESPONSE_WARM_SECONDS", "0.9"))))\n',
          )
          exact_replace(
              policy,
              '_background_tasks: set[asyncio.Task] = set()\n',
              '_background_tasks: set[asyncio.Task] = set()\n_season_refresh_tasks: dict[tuple[int, int], asyncio.Task] = {}\n',
          )

          spawn_fn = textwrap.dedent('''
          def _spawn_refresh(tmdb_id: int, season_number: int, episodes: list[dict]) -> asyncio.Task:
              key = (int(tmdb_id), int(season_number))
              current = _season_refresh_tasks.get(key)
              if current is not None and not current.done():
                  return current

              task = asyncio.create_task(_refresh_uncached(tmdb_id, season_number, episodes))
              _season_refresh_tasks[key] = task
              _background_tasks.add(task)

              def cleanup(done: asyncio.Task) -> None:
                  _background_tasks.discard(done)
                  if _season_refresh_tasks.get(key) is done:
                      _season_refresh_tasks.pop(key, None)

              task.add_done_callback(cleanup)
              return task
          ''').strip() + "\n\n\n"
          regex_replace(
              policy,
              r'def _spawn_refresh\(tmdb_id: int, season_number: int, episodes: list\[dict\]\) -> None:.*?\n\n\ndef _annotate_cached',
              spawn_fn + 'def _annotate_cached',
              marker='_season_refresh_tasks.get(key)',
          )

          season_inner = textwrap.dedent('''
          @router.get(ROUTE_PATH)
          async def italian_aware_season(tmdb_id: int, season_number: int):
              value = legacy_endpoint(tmdb_id=tmdb_id, season_number=season_number)
              if inspect.isawaitable(value):
                  value = await value
              if not isinstance(value, dict):
                  return value

              episodes = value.get("episodes")
              if not isinstance(episodes, list) or not episodes:
                  return {
                      **value,
                      "episodes": [],
                      "italian_audio_policy": "strict_confirmed_italian_only",
                      "italian_audio_policy_version": POLICY_VERSION,
                      "pending_recheck_seconds": 90,
                  }

              annotated: list[dict] = []
              needs_refresh = False
              for index, episode in enumerate(episodes):
                  row, missing = _annotate_cached(int(tmdb_id), int(season_number), episode, index)
                  annotated.append(row)
                  needs_refresh = needs_refresh or missing

              if needs_refresh:
                  refresh_task = _spawn_refresh(int(tmdb_id), int(season_number), episodes)
                  try:
                      await asyncio.wait_for(
                          asyncio.shield(refresh_task),
                          timeout=FIRST_RESPONSE_WARM_SECONDS,
                      )
                  except asyncio.TimeoutError:
                      pass
                  except Exception:
                      pass

                  annotated = []
                  needs_refresh = False
                  for index, episode in enumerate(episodes):
                      row, missing = _annotate_cached(int(tmdb_id), int(season_number), episode, index)
                      annotated.append(row)
                      needs_refresh = needs_refresh or missing

              visible = [row for row in annotated if row.get("italian_available") is True]

              if visible and any(
                  not str(row.get("name") or "").strip()
                  or not str(row.get("overview") or "").strip()
                  for row in visible
              ):
                  try:
                      english = await asyncio.wait_for(
                          _english_episode_map(int(tmdb_id), int(season_number)),
                          timeout=0.45,
                      )
                  except Exception:
                      english = {}
                  for row in visible:
                      number = int(row.get("episode_number") or 0)
                      fallback = english.get(number) or {}
                      if not str(row.get("name") or "").strip():
                          row["name"] = fallback.get("name") or row.get("name")
                      if not str(row.get("overview") or "").strip():
                          row["overview"] = fallback.get("overview") or ""

              return {
                  **value,
                  "episodes": visible,
                  "italian_audio_policy": "strict_confirmed_italian_only",
                  "italian_audio_policy_version": POLICY_VERSION,
                  "pending_recheck_seconds": 1 if needs_refresh else 90,
              }
          ''').strip()
          season_fn = textwrap.indent(season_inner, "    ")
          regex_replace(
              policy,
              r'    @router\.get\(ROUTE_PATH\)\n    async def italian_aware_season.*?\n    app\.include_router\(router\)',
              season_fn + '\n\n    app.include_router(router)',
              marker='"pending_recheck_seconds": 1 if needs_refresh else 90,',
          )

          episodes_hook = "frontend/src/pages/detail/useEpisodes.ts"
          exact_replace(
              episodes_hook,
              '      if (pending > 0 && pending <= 10) return 4000;\n',
              '      if (pending > 0 && pending <= 10) return 750;\n',
          )
          exact_replace(
              episodes_hook,
              '      // The backend returns 4s only while language checks are actually pending.\n',
              '      // The backend returns a short retry hint only while language checks are pending.\n',
          )
          print("SC logo + fast episode hotfixes applied")
          PY

      - name: Validate hotfix
        run: |
          python -m py_compile backend/services/artwork_card_policy.py backend/services/italian_episode_policy.py
          grep -q 'text.startsWith("/api/")' frontend/src/components/HeroSection.tsx
          grep -q 'const fallbackLogoPath = null' frontend/src/components/HeroSection.tsx
          grep -q 'from services.sc_artwork_catalog import _url_for' backend/services/artwork_card_policy.py
          grep -q 'FIRST_RESPONSE_WARM_SECONDS' backend/services/italian_episode_policy.py
          grep -q 'return 750' frontend/src/pages/detail/useEpisodes.ts

      - name: Commit patched application files
        run: |
          FILES=(
            frontend/src/components/HeroSection.tsx
            frontend/src/pages/detail/useEpisodes.ts
            backend/services/artwork_card_policy.py
            backend/services/italian_episode_policy.py
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo "Hotfixes already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "fix: restore SC logos and speed episode availability"
          git pull --rebase origin main
          git push origin HEAD:main
